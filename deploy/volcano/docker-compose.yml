services:
  backend:
    build:
      context: ../../backend
    container_name: bilibili-backend
    env_file:
      - ./backend.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
    container_name: bilibili-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
