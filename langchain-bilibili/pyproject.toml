[project]
name = "langchain-bilibili"
version = "0.1.0"
description = "A minimal LangChain MVP for understanding Bilibili video content"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
langchain-bilibili = "langchain_bilibili:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
